<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta http-equiv="Cross-Origin-Opener-Policy" content="same-origin-allow-popups">
  <meta http-equiv="Cross-Origin-Embedder-Policy" content="unsafe-none">
  <!-- SECURE CSP UPDATED FOR STICKERS/GIFS -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'self' https:; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net https://accounts.google.com https://apis.google.com https://*.supabase.co; style-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net https:; img-src 'self' data: blob: https: https://*.supabase.co https://*.giphy.com https://*.tenor.com https://*.imgflip.com https://i.imgflip.com https://media.giphy.com https://c.tenor.com https://media.tenor.com; font-src 'self' data: https:; connect-src 'self' https://*.supabase.co https://accounts.google.com https://*.googleusercontent.com wss://*.supabase.co https://g.tenor.com https://api.giphy.com https://api.tenor.com; frame-src 'self' https://accounts.google.com; media-src 'self' blob: https://*.supabase.co https://*.giphy.com https://*.tenor.com;">
  <meta name="referrer" content="strict-origin-when-cross-origin">
  <title>Private Room Chat</title>
  <link rel="icon" type="image/png" href="image/mylove.png">
  <link rel="stylesheet" href="chat.css" />
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://cdn.jsdelivr.net/npm/emoji-mart@latest/dist/browser.js"></script>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/emoji-mart@latest/css/emoji-mart.css">
  <script src="https://accounts.google.com/gsi/client" async defer></script>
  <style>
    *{box-sizing:border-box}
    body { margin:0; height:100vh; height:100dvh; display:flex; flex-direction:column; background:#efe7dd; overflow:hidden; font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif; }
    .top-bar { background:#4a148c; color:white; padding:10px 12px; display:flex; align-items:center; gap:8px; flex-shrink:0; }
    #menu-toggle{ background:rgba(255,255,255,0.2); border:none; color:white; width:38px; height:38px; border-radius:8px; cursor:pointer; font-size:22px; display:none; flex-shrink:0; }
    #general-btn { background:#2e0a5c; color:white; border:1px solid rgba(255,255,255,0.3); padding:6px 12px; border-radius:20px; cursor:pointer; font-weight:bold; flex-shrink:0; }
    #room-input { padding:7px 10px; border-radius:8px; border:none; width:110px; flex-shrink:0; }
    #join-btn { background:white; color:#4a148c; border:none; padding:7px 12px; border-radius:8px; cursor:pointer; font-weight:bold; flex-shrink:0; }
    #current-room-label { font-weight:600; flex:1; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; min-width:0; font-size:14px; }
    #online-count{ background:rgba(0,0,0,0.25); border:1px solid rgba(255,255,255,0.3); padding:5px 10px; border-radius:20px; font-size:12px; display:flex; align-items:center; gap:6px; flex-shrink:0; cursor:pointer; font-weight:600; }
    #online-count .dot{ width:8px; height:8px; background:#00e676; border-radius:50%; box-shadow:0 0 6px #00e676; animation:pulse 2s infinite; }
    @keyframes pulse{ 0%{opacity:1} 50%{opacity:0.6} 100%{opacity:1} }
    #change-profile-btn { background:rgba(255,255,255,0.2); border:none; color:white; width:36px; height:36px; border-radius:50%; cursor:pointer; font-size:18px; flex-shrink:0; }
    #mobile-drawer{ position:fixed; top:0; left:0; right:0; background:#4a148c; color:white; z-index:9999; padding:16px; transform:translateY(-100%); transition:0.3s ease; box-shadow:0 8px 20px rgba(0,0,0,0.3); border-radius:0 0 16px 16px; max-height:90vh; overflow-y:auto; }
    #mobile-drawer.open{ transform:translateY(0); }
    #mobile-drawer .drawer-row{ display:flex; gap:8px; margin:10px 0; }
    #mobile-drawer input{ flex:1; padding:10px; border-radius:10px; border:none; }
    #mobile-drawer button{ padding:10px 16px; border-radius:10px; border:none; font-weight:bold; cursor:pointer; }
    #drawer-close{ position:absolute; top:10px; right:12px; background:rgba(255,255,255,0.2); border:none; color:white; width:32px; height:32px; border-radius:50%; cursor:pointer; }
    #chat-messages { flex:1; overflow-y:auto; padding:12px; display:flex; flex-direction:column; gap:10px; -webkit-overflow-scrolling:touch; }
    .bottom-bar { background:#f0f0f0; padding:8px 10px; display:flex; gap:6px; align-items:center; flex-shrink:0; padding-bottom: max(8px, env(safe-area-inset-bottom)); position:relative; }
    .bottom-bar button.icon-btn { width:40px; height:40px; border-radius:50%; border:none; background:transparent; font-size:20px; cursor:pointer; flex-shrink:0; display:flex; align-items:center; justify-content:center; }
    .bottom-bar button.icon-btn:hover { background:#e0e0e0; }
    #chat-input { flex:1; min-width:0; padding:11px 14px; border-radius:22px; border:1px solid #ccc; outline:none; font-size:16px; }
    #send-btn { background:#4a148c; color:white; border:none; padding:10px 18px; border-radius:22px; cursor:pointer; flex-shrink:0; font-weight:bold; }
    #online-popup{ position:fixed; top:60px; right:10px; width:300px; background:white; border-radius:16px; box-shadow:0 12px 30px rgba(0,0,0,0.25); z-index:9998; display:none; overflow:hidden; }
    #online-popup.open{ display:block; }
    #online-popup-header{ background:#4a148c; color:white; padding:12px 14px; font-weight:bold; display:flex; justify-content:space-between; align-items:center; }
    /* STICKER PANEL - floats, does NOT push layout */
    #sticker-panel{ position:fixed; bottom:70px; right:10px; width:340px; max-width:95vw; height:380px; background:white; border-radius:18px; box-shadow:0 12px 40px rgba(0,0,0,0.35); z-index:9997; display:none; flex-direction:column; overflow:hidden; }
    #sticker-panel.open{ display:flex; }
    #sticker-tabs{ display:flex; gap:6px; padding:8px; background:#f5f0ff; }
    .sticker-tab{ flex:1; padding:8px; border:none; border-radius:10px; cursor:pointer; font-weight:600; font-size:13px; }
    .sticker-tab.active{ background:#4a148c; color:white; }
    #sticker-grid{ flex:1; overflow-y:auto; padding:10px; display:grid; grid-template-columns:repeat(3,1fr); gap:8px; }
    .sticker-item{ cursor:pointer; background:#faf7ff; border-radius:12px; aspect-ratio:1; display:flex; align-items:center; justify-content:center; overflow:hidden; font-size:36px; }
    .sticker-item img{ width:100%; height:100%; object-fit:cover; }
    .sticker-item:hover{ background:#f0eaff; transform:scale(1.05); }
    @media (max-width: 680px){
      #menu-toggle{ display:flex; align-items:center; justify-content:center; }
      #general-btn, #room-input, #join-btn{ display:none; }
      #current-room-label{ font-size:12px; }
      #online-count{ padding:4px 8px; font-size:11px; }
      #chat-input{ font-size:16px; }
      #chat-messages{ padding:10px; }
      .bottom-bar{ gap:4px; padding:6px 8px; }
      .bottom-bar button.icon-btn{ width:36px; height:36px; font-size:18px; }
      #online-popup{ right:5px; left:5px; width:auto; top:55px; }
      #sticker-panel{ right:5px; left:5px; width:auto; bottom:65px; }
    }
    .hidden { display:none!important; }
  </style>
</head>
<body>

<form autocomplete="off" style="display:none;">
  <input type="text" name="prevent_autofill" />
  <input type="password" name="prevent_autofill2" />
</form>

<div class="top-bar">
  <button id="menu-toggle" type="button">☰</button>
  <button id="general-btn" type="button"># General</button>
  <input type="text" id="room-input" placeholder="Room name" autocomplete="off" data-lpignore="true" data-form-type="other" spellcheck="false">
  <button id="join-btn" type="button">Join</button>
  <span id="current-room-label">Room: general | You: Guest</span>
  <div id="online-count" title="Who's online">
    <span class="dot"></span>
    <span id="online-number">0 online</span>
  </div>
  <button id="change-profile-btn" type="button" title="Profile">⚙️</button>
</div>

<div id="online-popup">
  <div id="online-popup-header">
    <span>🟢 Online in this room</span>
    <button id="online-popup-close" style="background:rgba(255,255,255,0.2); border:none; color:white; width:28px; height:28px; border-radius:50%; cursor:pointer;">✕</button>
  </div>
  <div id="online-users-container" style="padding:10px; max-height:280px; overflow-y:auto; display:flex; flex-direction:column; gap:8px;"></div>
</div>

<div id="mobile-drawer">
  <button id="drawer-close" type="button">✕</button>
  <div style="font-weight:bold; font-size:18px; margin-bottom:4px;">Private Room Chat</div>
  <div id="drawer-info" style="opacity:0.9; font-size:13px; margin-bottom:12px;">Room: general | You: Guest</div>
  <div id="online-list-drawer" style="margin:12px 0; background:rgba(0,0,0,0.25); border-radius:12px; padding:10px;">
    <div style="font-size:12px; font-weight:bold; opacity:0.9; margin-bottom:8px; display:flex; justify-content:space-between;">
      <span>🟢 Online Now</span>
      <span id="online-number-drawer">0</span>
    </div>
    <div id="online-users-container-drawer" style="display:flex; flex-direction:column; gap:6px; max-height:140px; overflow-y:auto;"></div>
  </div>
  <div class="drawer-row">
    <button id="drawer-general" type="button" style="background:#2e0a5c; color:white; flex:1;"># General</button>
    <button id="drawer-profile" type="button" style="background:rgba(255,255,255,0.2); color:white;">⚙️ Profile</button>
  </div>
  <div class="drawer-row">
    <input type="text" id="drawer-room-input" placeholder="Enter room name (e.g. 2k26)" autocomplete="off" data-lpignore="true" spellcheck="false">
    <button id="drawer-join" type="button" style="background:white; color:#4a148c;">Join</button>
  </div>
</div>

<div id="chat-messages"></div>

<div id="reply-preview" class="hidden" style="background:#fff3e0; border-top:1px solid #ffcc80; padding:8px 12px; display:none; align-items:center; justify-content:space-between; gap:10px;">
  <div style="flex:1; overflow:hidden;">
    <div id="reply-to-name" style="font-size:12px; font-weight:bold; color:#4a148c;"></div>
    <div id="reply-to-text" style="font-size:12px; color:#555; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;"></div>
  </div>
  <button id="reply-cancel" type="button" style="background:#eee; border:none; width:28px; height:28px; border-radius:50%; cursor:pointer;">×</button>
</div>

<!-- STICKER PANEL - SAME LOOK, JUST FLOATS -->
<div id="sticker-panel">
  <div id="sticker-tabs">
    <button class="sticker-tab active" data-tab="stickers">Stickers</button>
    <button class="sticker-tab" data-tab="gifs">GIFs</button>
    <button class="sticker-tab" data-tab="memes">Memes</button>
    <button id="sticker-close" style="background:#eee; border:none; width:28px; height:28px; border-radius:50%; cursor:pointer; margin-left:4px;">✕</button>
  </div>
  <div style="padding:8px; display:none;" id="gif-search-wrap">
    <input id="gif-search" placeholder="Search GIFs / memes..." style="width:100%; padding:10px; border-radius:10px; border:1px solid #ddd;">
  </div>
  <div id="sticker-grid"></div>
</div>

<div class="bottom-bar">
  <button id="attach-btn" class="icon-btn" type="button">📎</button>
  <input type="file" id="file-input" hidden>
 
  <button id="sticker-btn" class="icon-btn" type="button" title="Stickers/GIFs">🌟</button>
  <input type="text" id="chat-input" placeholder="Type a message..." autocomplete="off" data-lpignore="true" data-form-type="other" spellcheck="false" autocorrect="off" autocapitalize="off" value="">
  <button id="mic-btn" class="icon-btn" type="button">🎤</button>
  <button id="send-btn" type="button">Send</button>
</div>

<div id="username-overlay" class="password-overlay" style="position:fixed; inset:0; background:rgba(0,0,0,0.75); display:flex; z-index:10000; align-items:center; justify-content:center; backdrop-filter:blur(5px);">
  <div class="password-box" style="background:white; width:92%; max-width:380px; padding:22px; border-radius:18px;">
    <h3 id="profileTitle" style="text-align:center; margin-bottom:10px;">Set Your Profile</h3>
    <img id="avatar-preview" src="https://via.placeholder.com/100/4a148c/ffffff?text=?" style="width:80px; height:80px; border-radius:50%; object-fit:cover; margin:0 auto; display:block;">
    <input type="file" id="avatar-input" accept="image/*" style="margin:10px 0; width:100%;">
    <input type="text" id="username-input" placeholder="Display name *required" autocomplete="off" data-lpignore="true" style="width:100%; padding:12px; border-radius:10px; border:1px solid #ddd; margin:6px 0; box-sizing:border-box;">
    <select id="p_gender" style="width:100%; padding:12px; border-radius:10px; border:1px solid #ddd; margin:6px 0; box-sizing:border-box;">
      <option value="">Gender *required</option>
      <option value="male">Male</option>
      <option value="female">Female</option>
      <option value="notsay">Prefer not to say</option>
    </select>
    <input type="email" id="p_gmail" placeholder="Gmail (optional)" autocomplete="off" style="width:100%; padding:12px; border-radius:10px; border:1px solid #ddd; margin:6px 0; box-sizing:border-box;">
    <div style="margin:12px 0; border-top:1px solid #eee; padding-top:12px;">
      <div id="g_id_onload"
           data-client_id="995545702819-e5lulcophiasgkuche8m72ggrng23a4r.apps.googleusercontent.com"
           data-callback="handleGoogle"
           data-auto_prompt="false">
      </div>
      <div class="g_id_signin" data-type="standard" data-shape="pill" data-theme="outline" data-text="signin_with" data-size="large" data-width="320"></div>
    </div>
    <button id="username-btn" type="button" style="width:100%; margin-top:12px; background:#4a148c; color:white; border:none; padding:12px; border-radius:10px; cursor:pointer; font-weight:bold;">Save & Enter Chat</button>
    <button id="closeProfileBtn" type="button" style="width:100%; margin-top:8px; background:#eee; color:#333; border:none; padding:10px; border-radius:10px; display:none;">Cancel</button>
  </div>
</div>

<div id="room-pass-overlay" class="password-overlay hidden" style="position:fixed; inset:0; background:rgba(0,0,0,0.6); display:flex; align-items:center; justify-content:center; z-index:9999;">
  <div class="password-box" style="background:white; padding:20px; border-radius:16px; width:92%; max-width:340px;">
    <h3 id="room-pass-title">Enter Password</h3>
    <p id="room-pass-desc" style="font-size:13px; color:#666;"></p>
    <div style="position:relative; margin:10px 0;">
      <input type="password" id="room-pass-input" placeholder="Room password" autocomplete="new-password" style="width:100%; padding:12px; border-radius:10px; border:1px solid #ddd; box-sizing:border-box;">
      <span id="toggle-pass" style="position:absolute; right:10px; top:50%; transform:translateY(-50%); cursor:pointer;">👁️</span>
    </div>
    <p id="room-pass-error" style="color:red; font-size:12px; min-height:16px;"></p>
    <div style="display:flex; gap:8px; margin-top:10px;">
      <button id="room-pass-close" type="button" style="flex:1; background:#eee; border:none; padding:10px; border-radius:10px; cursor:pointer;">Cancel</button>
      <button id="room-pass-btn" type="button" style="flex:1; background:#4a148c; color:white; border:none; padding:10px; border-radius:10px; cursor:pointer; font-weight:bold;">Join Room</button>
    </div>
  </div>
</div>

<script src="chat.js"></script>
<script>
// --- YOUR ORIGINAL UI LOGIC (UNTOUCHED) ---
const menuToggle = document.getElementById('menu-toggle');
const drawer = document.getElementById('mobile-drawer');
const drawerClose = document.getElementById('drawer-close');
const onlineCountBtn = document.getElementById('online-count');
const onlinePopup = document.getElementById('online-popup');
const onlinePopupClose = document.getElementById('online-popup-close');

menuToggle.addEventListener('click', ()=> drawer.classList.add('open'));
drawerClose.addEventListener('click', ()=> drawer.classList.remove('open'));
onlineCountBtn.addEventListener('click', ()=>{ onlinePopup.classList.toggle('open'); });
onlinePopupClose.addEventListener('click', ()=>{ onlinePopup.classList.remove('open'); });

document.getElementById('drawer-general').addEventListener('click', ()=>{
  document.getElementById('general-btn').click();
  drawer.classList.remove('open');
});
document.getElementById('drawer-join').addEventListener('click', ()=>{
  const val = document.getElementById('drawer-room-input').value.trim();
  const roomIn = document.getElementById('room-input');
  if(roomIn){ roomIn.value = val; }
  document.getElementById('join-btn').click();
  document.getElementById('drawer-room-input').value = "";
  drawer.classList.remove('open');
});
document.getElementById('drawer-profile').addEventListener('click', ()=>{
  document.getElementById('change-profile-btn').click();
  drawer.classList.remove('open');
});

function hardClearInputs(){
  const ci = document.getElementById('chat-input');
  const ri = document.getElementById('room-input');
  const dri = document.getElementById('drawer-room-input');
  if(ci){ ci.value = ""; ci.defaultValue = ""; }
  if(ri){ ri.value = ""; ri.defaultValue = ""; }
  if(dri){ dri.value = ""; dri.defaultValue = ""; }
}
window.addEventListener('DOMContentLoaded', hardClearInputs);
window.addEventListener('load', hardClearInputs);
window.addEventListener('pageshow', hardClearInputs);
setTimeout(hardClearInputs, 100);
setTimeout(hardClearInputs, 500);

setInterval(()=>{
  const label = document.getElementById('current-room-label')?.innerText || '';
  const drawerInfo = document.getElementById('drawer-info');
  if(drawerInfo) drawerInfo.innerText = label;
}, 500);

document.addEventListener('click', (e)=>{
  if(!onlinePopup.contains(e.target) && !onlineCountBtn.contains(e.target) && !document.getElementById('sticker-panel').contains(e.target) && e.target.id!=='sticker-btn'){
    onlinePopup.classList.remove('open');
  }
});

// --- STICKER / GIF / MEME LOGIC (NEW, DOESN'T CHANGE LAYOUT) ---
const stickerBtn = document.getElementById('sticker-btn');
const stickerPanel = document.getElementById('sticker-panel');
const stickerGrid = document.getElementById('sticker-grid');
const gifSearch = document.getElementById('gif-search');
const searchWrap = document.getElementById('gif-search-wrap');
const stickerClose = document.getElementById('sticker-close');

const MY_STICKERS = ["❤️","😍","🔥","😂","😭","🥺","😎","🤩","🥳","💜","✨","🎉","👑","💀","💯","🥰","😇","🤣","🙏","😈"];
let currentTab = "stickers";

function renderTab(tab, query=""){
  stickerGrid.innerHTML="";
  if(tab==="stickers"){
    searchWrap.style.display="none";
    MY_STICKERS.forEach(s=>{
      const div=document.createElement('div'); div.className='sticker-item'; div.textContent=s;
      div.onclick=()=>{ window.sendSticker(s); stickerPanel.classList.remove('open'); };
      stickerGrid.appendChild(div);
    });
  } else {
    searchWrap.style.display="block";
    const q = query || (tab==="gifs"?"funny":"meme funny");
    fetch(`https://g.tenor.com/v1/search?q=${encodeURIComponent(q)}&key=LIVDSRZULELA&limit=21`)
    .then(r=>r.json()).then(d=>{
      stickerGrid.innerHTML="";
      (d.results||[]).forEach(g=>{
        const url = g.media[0]?.tinygif?.url || g.media[0]?.gif?.url;
        if(!url) return;
        const img=document.createElement('div'); img.className='sticker-item';
        img.innerHTML=`<img src="${url}" loading="lazy">`;
        img.onclick=()=>{ window.sendSticker(url); stickerPanel.classList.remove('open'); };
        stickerGrid.appendChild(img);
      });
    }).catch(()=>{ stickerGrid.innerHTML="<div style='grid-column:1/3; padding:20px; text-align:center; color:#888;'>No results. Check internet.</div>"; });
  }
}

document.querySelectorAll('.sticker-tab').forEach(b=>{
  b.onclick=()=>{
    document.querySelectorAll('.sticker-tab').forEach(x=>x.classList.remove('active'));
    b.classList.add('active');
    currentTab=b.dataset.tab;
    renderTab(currentTab, gifSearch.value);
  };
});

stickerBtn.onclick=()=>{
  stickerPanel.classList.toggle('open');
  if(stickerPanel.classList.contains('open')) renderTab(currentTab);
};
stickerClose.onclick=()=> stickerPanel.classList.remove('open');

let t;
gifSearch.oninput=()=>{
  clearTimeout(t);
  t=setTimeout(()=> renderTab(currentTab, gifSearch.value), 500);
};
</script>
</body>
</html>
