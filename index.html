<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta http-equiv="Cross-Origin-Opener-Policy" content="same-origin-allow-popups">
  <title>Private Room Chat</title>
  <link rel="icon" type="image/png" href="image/mylove.png">
  <link rel="stylesheet" href="chat.css" />
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.0/dist/umd/supabase.min.js"></script>
  <style>
    *{box-sizing:border-box;-webkit-tap-highlight-color: transparent;}
    html,body{height:100%;}
    body { margin:0; height:100vh; height:100dvh; display:flex; flex-direction:column; background:#efe7dd; overflow:hidden; font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif; }
    .top-bar { background:#4a148c; color:white; padding:10px 12px; display:flex; align-items:center; gap:8px; flex-shrink:0; z-index:10; }
    #menu-toggle{ background:rgba(255,255,255,0.18); border:none; color:white; width:40px; height:40px; border-radius:10px; cursor:pointer; font-size:22px; display:none; flex-shrink:0; align-items:center; justify-content:center; }
    #general-btn { background:#2e0a5c; color:white; border:1px solid rgba(255,255,255,0.25); padding:7px 14px; border-radius:20px; cursor:pointer; font-weight:600; font-size:13px; flex-shrink:0; }
    #room-input { padding:8px 12px; border-radius:20px; border:none; width:130px; flex-shrink:0; font-size:14px; outline:none; }
    #join-btn { background:white; color:#4a148c; border:none; padding:8px 14px; border-radius:20px; cursor:pointer; font-weight:700; font-size:13px; flex-shrink:0; }
    #current-room-label { font-weight:600; flex:1; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; min-width:0; font-size:14px; }
    #online-count{ background:rgba(0,0,0,0.25); border:1px solid rgba(255,255,255,0.25); padding:6px 10px; border-radius:20px; font-size:12px; display:flex; align-items:center; gap:6px; flex-shrink:0; cursor:pointer; font-weight:600; }
    #online-count .dot{ width:8px; height:8px; background:#00e676; border-radius:50%; }
    .top-icon{ background:rgba(255,255,255,0.18); border:none; color:white; width:40px; height:40px; border-radius:50%; cursor:pointer; font-size:18px; flex-shrink:0; display:flex; align-items:center; justify-content:center; }
    #mobile-drawer{ position:fixed; top:0; left:0; bottom:0; width:82%; max-width:320px; background:#2e0a5c; color:white; z-index:9999; padding:20px 16px; transform:translateX(-105%); transition:0.3s cubic-bezier(.2,.8,.2,1); box-shadow:8px 0 30px rgba(0,0,0,0.4); display:flex; flex-direction:column; }
    #mobile-drawer.open{ transform:translateX(0); }
    #drawer-close{ position:absolute; top:12px; right:12px; background:rgba(255,255,255,0.15); border:none; color:white; width:36px; height:36px; border-radius:50%; cursor:pointer; font-size:16px; }
    #drawer-backdrop{ position:fixed; inset:0; background:rgba(0,0,0,0.45); z-index:9998; display:none; }
    #drawer-backdrop.open{ display:block; }
    #chat-messages { flex:1; overflow-y:auto; padding:14px 12px; display:flex; flex-direction:column; gap:10px; -webkit-overflow-scrolling:touch; position:relative; }
    .bottom-bar { background:#f7f7f7; padding:8px 10px; display:flex; gap:6px; align-items:center; flex-shrink:0; border-top:1px solid #e0e0e0; }
    .bottom-bar button.icon-btn { width:42px; height:42px; border-radius:50%; border:none; background:transparent; font-size:20px; cursor:pointer; flex-shrink:0; display:flex; align-items:center; justify-content:center; }
    #chat-input { flex:1; min-width:0; padding:12px 16px; border-radius:24px; border:1px solid #ddd; outline:none; font-size:16px; background:white; }
    #send-btn { background:#4a148c; color:white; border:none; padding:11px 20px; border-radius:24px; cursor:pointer; flex-shrink:0; font-weight:700; font-size:14px; }
    @media (max-width: 680px){ #menu-toggle{ display:flex; } #general-btn, #room-input, #join-btn{ display:none; } }
    .hidden { display:none!important; }
    #notif-drawer.open{display:flex!important; animation:slideIn .3s ease}
    #notif-backdrop.open{display:block!important}
    @keyframes slideIn{from{transform:translateX(100%)} to{transform:translateX(0)}}
    .notif-item{display:flex;gap:10px;padding:10px;border-radius:12px;cursor:pointer;margin-bottom:8px;background:#fafafa;border:1px solid #f0f0f0}
    .notif-item.unread{background:#f5f0ff;border-color:#d1c4e9}
    #sticker-backdrop{position:fixed;inset:0;background:rgba(0,0,0,0.2);z-index:9997;display:none}
    #sticker-backdrop.open{display:block}
    #profile-menu{position:fixed;top:65px;right:10px;width:340px;background:white;border-radius:16px;box-shadow:0 8px 24px rgba(0,0,0,0.2);z-index:99999;display:none;overflow:hidden;color:#333}
    #communities-popup{position:fixed;top:65px;right:60px;width:320px;max-height:70vh;background:white;border-radius:16px;box-shadow:0 8px 24px rgba(0,0,0,0.2);z-index:99999;display:none;flex-direction:column;overflow:hidden;color:#333}
  </style>
</head>
<body>

<div class="top-bar">
  <button id="menu-toggle" type="button">☰</button>
  <button id="general-btn" type="button"># General</button>
  <input type="text" id="room-input" placeholder="Room name" autocomplete="off">
  <button id="join-btn" type="button">Join</button>
  <span id="current-room-label">Room: general | You: Guest</span>

  <div style="display:flex; align-items:center; gap:8px; margin-left:auto;">
    <button id="notif-bell" style="width:36px; height:36px; border-radius:50%; background:rgba(255,255,255,0.2); border:none; color:white; cursor:pointer; font-size:18px; position:relative;">
      🔔
      <span id="notif-badge" style="display:none; position:absolute; top:-4px; right:-4px; background:#ff1744; color:white; font-size:11px; font-weight:bold; min-width:18px; height:18px; border-radius:9px; text-align:center; line-height:18px; padding:0 4px;">0</span>
    </button>
    <div id="online-count"><span class="dot"></span><span id="online-number">0</span></div>
    <button id="communities-btn" class="top-icon" type="button">👥</button>
    <button id="change-profile-btn" class="top-icon" type="button">⚙️</button>
    <img id="nav-profile-pic" src="" style="width:36px; height:36px; border-radius:50%; cursor:pointer; background:#fff; border:2px solid rgba(255,255,255,0.5)" onclick="toggleProfileMenu()" title="My Private Chats">
  </div>
</div>

<div id="drawer-backdrop"></div>
<div id="mobile-drawer">
  <button id="drawer-close" type="button">✕</button>
  <div style="font-weight:800; font-size:22px; margin:6px 0 2px;">Private Room Chat</div>
  <div id="drawer-info" style="opacity:0.85; font-size:13px; margin-bottom:18px;">Room: general | You: Guest</div>
  <div id="online-list-drawer" style="background:rgba(0,0,0,0.25); border-radius:14px; padding:12px; margin-bottom:16px;">
    <div style="font-size:12px; font-weight:700; opacity:0.9; margin-bottom:8px; display:flex; justify-content:space-between;"><span>🟢 Online Now</span><span id="online-number-drawer">0</span></div>
    <div id="online-users-container-drawer" style="display:flex; flex-direction:column; gap:6px; max-height:180px; overflow-y:auto;"></div>
  </div>
  <div style="display:flex; gap:8px; margin:8px 0;">
    <button id="drawer-general" type="button" style="background:white; color:#4a148c; flex:1; padding:12px; border-radius:12px; border:none; font-weight:700;"># General</button>
    <button id="drawer-profile" type="button" style="background:rgba(255,255,255,0.15); color:white; padding:12px 16px; border-radius:12px; border:none;">⚙️</button>
  </div>
  <div style="display:flex; gap:8px;">
    <input type="text" id="drawer-room-input" placeholder="Enter room name" autocomplete="off" style="flex:1; padding:12px; border-radius:12px; border:none; font-size:15px;">
    <button id="drawer-join" type="button" style="background:white; color:#4a148c; padding:12px 18px; border-radius:12px; border:none; font-weight:800;">Join</button>
  </div>
</div>

<div id="chat-messages"></div>

<div id="reply-preview" class="hidden" style="display:flex; background:#fff3e0; padding:10px;"><div style="flex:1;"><div id="reply-to-name" style="font-size:12px; font-weight:800; color:#4a148c;"></div><div id="reply-to-text" style="font-size:12px;"></div></div><button id="reply-cancel" type="button" style="background:#eee; border:none; width:32px; height:32px; border-radius:50%;">×</button></div>

<!-- STICKER BACKDROP - CLICK OUTSIDE TO CLOSE -->
<div id="sticker-backdrop"></div>

<!-- STICKER PANEL -->
<div id="sticker-panel" style="display:none;position:absolute;bottom:60px;left:0;right:0;background:white;border-top:1px solid #ddd;height:340px;z-index:9998;flex-direction:column">
  <div style="display:flex;gap:8px;padding:10px;border-bottom:1px solid #eee;align-items:center">
    <button class="stk-tab active" data-tab="emoji" style="padding:8px 12px;background:#4a148c;color:white;border:none;border-radius:8px;cursor:pointer">😊 Emoji</button>
    <button class="stk-tab" data-tab="gif" style="padding:8px 12px;background:#eee;border:none;border-radius:8px;cursor:pointer">GIFs</button>
    <button class="stk-tab" data-tab="sticker" style="padding:8px 12px;background:#eee;border:none;border-radius:8px;cursor:pointer">Stickers</button>
    <input id="gif-search" placeholder="Search billions of GIFs..." style="flex:1;padding:8px 12px;border:1px solid #ddd;border-radius:20px;display:none">
    <button onclick="closeStickerPanel()" style="border:none;background:#eee;width:32px;height:32px;border-radius:50%;cursor:pointer">✕</button>
  </div>
  <div id="sticker-content" style="flex:1;overflow-y:auto;padding:10px;display:grid;grid-template-columns:repeat(auto-fill,minmax(70px,1fr));gap:8px"></div>
</div>

<div class="bottom-bar">
  <button id="attach-btn" class="icon-btn" type="button">📎</button>
  <input type="file" id="file-input" hidden>
  <button id="sticker-btn" class="icon-btn" type="button">😊</button>
  <input type="text" id="chat-input" placeholder="Type a message..." autocomplete="off">
  <button id="mic-btn" class="icon-btn" type="button">🎤</button>
  <button id="send-btn" type="button">Send</button>
</div>

<!-- PROFILE MENU - THIS IS WHAT YOUR RED MARKED PIC OPENS -->
<div id="profile-menu">
  <div style="padding:16px;display:flex;gap:12px;align-items:center;border-bottom:1px solid #eee">
    <img id="pm-avatar" style="width:48px;height:48px;border-radius:50%;object-fit:cover;background:#eee">
    <div><div id="pm-name" style="font-weight:700">Guest</div><div id="pm-email" style="font-size:12px;color:#666"></div><div id="pm-gender" style="font-size:11px;color:#888"></div></div>
  </div>
  <div style="padding:12px">
    <div style="font-weight:700;font-size:13px;margin-bottom:8px">My Private Chats - Tap to open</div>
    <div id="recent-chats-list"></div>
    <button onclick="document.getElementById('profile-menu').style.display='none'; document.getElementById('username-overlay').style.display='flex'" style="width:100%;margin-top:10px;padding:10px;background:#f5f0ff;border:none;border-radius:10px;color:#4a148c;font-weight:600;cursor:pointer">Edit Profile</button>
  </div>
</div>

<!-- COMMUNITIES POPUP - FIXED -->
<div id="communities-popup">
  <div style="padding:14px 16px;font-weight:700;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #eee">
    <span>Joined Communities</span><span id="communities-popup-close" style="cursor:pointer">✕</span>
  </div>
  <div id="communities-list-popup" style="padding:8px;overflow-y:auto;max-height:400px"></div>
</div>

<div id="username-overlay" style="position:fixed; inset:0; background:rgba(0,0,0,0.75); display:flex; z-index:10000; align-items:center; justify-content:center;"><div style="background:white; width:92%; max-width:380px; padding:22px; border-radius:18px;"><h3 style="text-align:center;">Set Your Profile</h3><img id="avatar-preview" src="https://via.placeholder.com/100/4a148c/ffffff?text=?" style="width:80px; height:80px; border-radius:50%; display:block; margin:0 auto;"><input type="file" id="avatar-input" accept="image/*" style="margin:10px 0; width:100%;"><input type="text" id="username-input" placeholder="Display name *required" style="width:100%; padding:12px; border-radius:10px; border:1px solid #ddd; margin:6px 0;"><select id="p_gender" style="width:100%; padding:12px; border-radius:10px; border:1px solid #ddd; margin:6px 0;"><option value="">Gender *required</option><option value="male">Male</option><option value="female">Female</option><option value="notsay">Prefer not to say</option></select><input type="email" id="p_gmail" placeholder="Gmail (optional)" style="width:100%; padding:12px; border-radius:10px; border:1px solid #ddd; margin:6px 0;"><button id="username-btn" type="button" style="width:100%; margin-top:12px; background:#4a148c; color:white; border:none; padding:12px; border-radius:10px; cursor:pointer; font-weight:bold;">Save & Enter Chat</button></div></div>

<div id="room-pass-overlay" class="hidden" style="position:fixed; inset:0; background:rgba(0,0,0,0.6); display:flex; align-items:center; justify-content:center; z-index:9999; display:none;"><div style="background:white; padding:20px; border-radius:16px; width:92%; max-width:340px;"><h3 id="room-pass-title">Enter Password</h3><p id="room-pass-desc"></p><input type="password" id="room-pass-input" placeholder="Room password" style="width:100%; padding:12px; border-radius:10px; border:1px solid #ddd;"><p id="room-pass-error" style="color:red;"></p><div style="display:flex; gap:8px;"><button id="room-pass-close">Cancel</button><button id="room-pass-btn">Join Room</button></div></div></div>

<div id="notif-backdrop" style="display:none; position:fixed; inset:0; background:rgba(0,0,0,0.3); z-index:99998;"></div>
<div id="notif-drawer" style="display:none; position:fixed; top:0; right:0; width:360px; max-width:90vw; height:100vh; background:white; z-index:99999; box-shadow:-4px 0 24px rgba(0,0,0,0.15); flex-direction:column;">
  <div style="padding:16px; border-bottom:1px solid #eee; display:flex; justify-content:space-between; align-items:center;">
    <h3 style="margin:0; font-size:18px;">Notifications</h3>
    <button id="notif-close" style="background:#f0f0f0; border:none; width:32px; height:32px; border-radius:50%; cursor:pointer;">✕</button>
  </div>
  <div id="notif-list" style="flex:1; overflow-y:auto; padding:12px;"></div>
  <div style="padding:12px; border-top:1px solid #eee;">
    <button id="notif-mark-read" style="width:100%; padding:10px; background:#f5f0ff; border:none; border-radius:10px; color:#4a148c; font-weight:600; cursor:pointer;">Mark all as read</button>
  </div>
</div>

<div id="user-profile-popup" style="display:none; position:fixed; inset:0; background:rgba(0,0,0,0.5); z-index:99999; align-items:center; justify-content:center;">
  <div style="background:white; border-radius:20px; padding:20px; width:90%; max-width:340px; text-align:center; position:relative;">
    <button id="user-profile-close" style="position:absolute; top:10px; right:12px; background:#eee; border:none; width:32px; height:32px; border-radius:50%;">✕</button>
    <img id="up-avatar" src="" style="width:90px; height:90px; border-radius:50%; margin:10px auto; display:block; background:#eee; border:3px solid #4a148c;">
    <h3 id="up-name">Name</h3>
    <p id="up-gender" style="color:#888;"></p>
    <p id="up-status" style="background:#f5f0ff; padding:8px; border-radius:10px;">● Online</p>
    <button id="up-message-btn" style="background:#4a148c; color:white; border:none; padding:12px 20px; border-radius:20px; width:100%; font-weight:bold;">💬 Message this person</button>
  </div>
</div>

<audio id="chime-audio" preload="auto"></audio>

<script src="chat.js"></script>
<script>
const menuToggle = document.getElementById('menu-toggle');
const drawer = document.getElementById('mobile-drawer');
const drawerClose = document.getElementById('drawer-close');
const drawerBackdrop = document.getElementById('drawer-backdrop');
function openDrawer(){ drawer.classList.add('open'); drawerBackdrop.classList.add('open'); }
function closeDrawer(){ drawer.classList.remove('open'); drawerBackdrop.classList.remove('open'); }
if(menuToggle) menuToggle.addEventListener('click', openDrawer);
if(drawerClose) drawerClose.addEventListener('click', closeDrawer);
if(drawerBackdrop) drawerBackdrop.addEventListener('click', closeDrawer);
document.getElementById('drawer-general')?.addEventListener('click', ()=>{ document.getElementById('general-btn')?.click(); closeDrawer(); });
document.getElementById('drawer-join')?.addEventListener('click', ()=>{ const val=document.getElementById('drawer-room-input').value.trim(); document.getElementById('room-input').value=val; document.getElementById('join-btn')?.click(); closeDrawer(); });

// Close panels when clicking outside
document.getElementById('sticker-backdrop')?.addEventListener('click', ()=>{ document.getElementById('sticker-panel').style.display='none'; document.getElementById('sticker-backdrop').style.display='none'; });
</script>
</body>
</html>
