<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Private Room Chat</title>
  <link rel="icon" type="image/png" href="image/mylove.png">
  <link rel="stylesheet" href="chat.css" />
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://cdn.jsdelivr.net/npm/emoji-mart@latest/dist/browser.js"></script>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/emoji-mart@latest/css/emoji-mart.css">
 <style>
    body { margin:0; height:100vh; display:flex; flex-direction:column; background:#efe7dd; overflow:hidden; }
    .top-bar { background:#4a148c; color:white; padding:10px 15px; display:flex; align-items:center; gap:10px; }
    #current-room-label { font-weight:bold; flex:1; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
    #change-profile-btn { background:rgba(255,255,255,0.2); border:none; color:white; width:36px; height:36px; border-radius:50%; cursor:pointer; font-size:18px; flex-shrink:0; }
    #chat-messages { flex:1; overflow-y:auto; padding:15px; display:flex; flex-direction:column; gap:12px; }
    .bottom-bar { background:#f0f0f0; padding:8px 10px; display:flex; gap:6px; align-items:center; position:relative; }
    .bottom-bar button.icon-btn { width:38px; height:38px; border-radius:50%; border:none; background:transparent; font-size:20px; cursor:pointer; flex-shrink:0; display:flex; align-items:center; justify-content:center; }
    .bottom-bar button.icon-btn:hover { background:#e0e0e0; }
    #chat-input { flex:1; padding:10px 14px; border-radius:20px; border:1px solid #ccc; outline:none; }
    #send-btn { background:#4a148c; color:white; border:none; padding:10px 18px; border-radius:20px; cursor:pointer; flex-shrink:0; font-weight:bold; }
    #mic-btn.recording { background:#ff3b30; color:white; animation:pulse 1s infinite; }
    @keyframes pulse { 0%{transform:scale(1)} 50%{transform:scale(1.1)} 100%{transform:scale(1)} }
    audio { max-width:220px; margin-top:5px; }
    .hidden { display:none!important; }
    #unified-picker { position:absolute; bottom:58px; left:0; right:0; background:white; border-radius:16px 16px 0 0; max-height:380px; display:flex; flex-direction:column; box-shadow:0 -4px 20px rgba(0,0,0,0.15); z-index:999; overflow:hidden; }
    #unified-picker.hidden { display:none!important; }
    .picker-tabs { display:flex; background:#f5f5f5; border-bottom:1px solid #ddd; }
    .picker-tab { flex:1; padding:12px; text-align:center; cursor:pointer; font-size:14px; font-weight:600; border-bottom:3px solid transparent; }
    .picker-tab.active { border-bottom-color:#4a148c; color:#4a148c; background:white; }
    .picker-content { flex:1; overflow-y:auto; padding:10px; }
    .picker-content.hidden { display:none!important; }
    #attach-menu { position:absolute; bottom:58px; left:10px; background:white; border-radius:12px; padding:8px; box-shadow:0 4px 15px rgba(0,0,0,0.2); z-index:1000; display:flex; flex-direction:column; gap:6px; min-width:160px; }
    #attach-menu.hidden { display:none!important; }
    #attach-menu button { display:flex; align-items:center; gap:10px; padding:10px 12px; border:none; background:#f8f8f8; border-radius:8px; cursor:pointer; text-align:left; font-size:14px; }
    #attach-menu button:hover { background:#eee; }
  </style>
</head>
<body>

<div class="top-bar">
  <button id="general-btn" type="button" style="background:#2e0a5c; color:white; border:1px solid rgba(255,255,255,0.3); padding:6px 12px; border-radius:20px; cursor:pointer; font-weight:bold; flex-shrink:0;"># General</button>
  <input type="text" id="room-input" placeholder="Room name" style="padding:6px 10px; border-radius:6px; border:none; max-width:100px;" autocomplete="off">
  <button id="join-btn" type="button" style="background:white; color:#4a148c; border:none; padding:6px 12px; border-radius:6px; cursor:pointer; font-weight:bold;">Join</button>
  <span id="current-room-label" style="flex:1; min-width:0;">Room: general | You: Guest</span>
  <button id="change-profile-btn" type="button" title="Profile / Communities">⚙️</button>
</div>

<div id="chat-messages"></div>
<div id="reply-preview" class="hidden" style="display:none; background:#f5f0ff; border-left:4px solid #4a148c; padding:8px 12px; align-items:center; gap:10px; border-top:1px solid #ddd;">
  <div style="flex:1; overflow:hidden;">
    <p id="reply-to-name" style="font-size:12px; font-weight:bold; color:#4a148c;"></p>
    <p id="reply-to-text" style="font-size:12px; color:#555; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;"></p>
  </div>
  <button id="reply-cancel" type="button" style="background:#eee; border:none; width:28px; height:28px; border-radius:50%; cursor:pointer;">×</button>
</div>
<div id="recording-preview" class="hidden" style="display:none; background:white; padding:10px 15px; border-top:1px solid #ddd; align-items:center; gap:10px;">
  <div style="width:12px; height:12px; background:red; border-radius:50%;"></div>
  <span id="recording-time" style="font-weight:bold; color:red;">00:00</span>
  <span style="flex:1; font-size:13px;">Recording...</span>
  <button id="recording-cancel" type="button" style="background:#eee; border:none; padding:6px 12px; border-radius:20px; cursor:pointer;">Cancel</button>
  <button id="recording-stop" type="button" style="background:#4a148c; color:white; border:none; padding:6px 12px; border-radius:20px; cursor:pointer;">Stop</button>
</div>

<div id="attach-menu" class="hidden">
  <button id="attach-photo" type="button">🖼️ Photo / Video</button>
  <button id="attach-file" type="button">📄 Document</button>
  <button id="attach-gif" type="button">🎞️ GIF</button>
  <button id="attach-sticker" type="button">🌟 Sticker</button>
</div>

<div id="unified-picker" class="hidden">
  <div class="picker-tabs">
    <div class="picker-tab active" data-tab="emoji">😊 Emoji</div>
    <div class="picker-tab" data-tab="gif">GIF</div>
    <div class="picker-tab" data-tab="sticker">Stickers</div>
  </div>
  <div id="tab-emoji" class="picker-content"></div>
  <div id="tab-gif" class="picker-content hidden">
    <div style="display:flex; gap:6px; margin-bottom:8px; position:sticky; top:0; background:white; padding-bottom:6px;">
      <input id="gif-search" placeholder="Search GIFs..." style="flex:1; padding:8px 12px; border-radius:20px; border:1px solid #ddd;">
    </div>
    <div id="gif-results" style="display:grid; grid-template-columns:repeat(2,1fr); gap:6px;"></div>
  </div>
  <div id="tab-sticker" class="picker-content hidden" style="display:grid; grid-template-columns:repeat(4,1fr); gap:8px;"></div>
</div>

<div class="bottom-bar">
  <button id="attach-btn" class="icon-btn" type="button">📎</button>
  <input type="file" id="file-input" hidden>
  <button id="emoji-btn" class="icon-btn" type="button">😊</button>
  <input type="text" id="chat-input" placeholder="Type a message..." autocomplete="off">
  <button id="mic-btn" class="icon-btn" type="button">🎤</button>
  <button id="send-btn" type="button">Send</button>
</div>

<div id="username-overlay" class="password-overlay">
  <div class="password-box">
    <h3>Set Your Profile</h3>
    <img id="avatar-preview" src="https://via.placeholder.com/100/4a148c/ffffff?text=?" style="width:80px; height:80px; border-radius:50%; object-fit:cover; margin:0 auto; display:block;">
    <input type="file" id="avatar-input" accept="image/*" style="margin:10px 0;">
    <input type="text" id="username-input" placeholder="Your name" autocomplete="off" style="width:100%; padding:10px; border-radius:8px; border:1px solid #ddd; margin-top:8px;">
    <button id="username-btn" type="button" style="width:100%; margin-top:10px; background:#4a148c; color:white; border:none; padding:10px; border-radius:8px; cursor:pointer;">Continue</button>
  </div>
</div>

<div id="room-pass-overlay" class="password-overlay hidden">
  <div class="password-box">
    <h3 id="room-pass-title">Enter Password</h3>
    <p id="room-pass-desc" style="font-size:13px; color:#666;"></p>
    <div style="display:flex; gap:5px; align-items:center;">
      <input type="password" id="room-pass-input" placeholder="Password" style="flex:1; padding:10px; border-radius:8px; border:1px solid #ddd;">
      <span id="toggle-pass" style="cursor:pointer; font-size:20px;">👁️</span>
    </div>
    <p id="room-pass-error" style="color:red; font-size:12px;"></p>
    <button id="room-pass-btn" type="button" style="width:100%; background:#4a148c; color:white; border:none; padding:10px; border-radius:8px; cursor:pointer;">Join Room</button>
    <button id="room-pass-close" type="button" style="width:100%; background:#eee; border:none; padding:10px; border-radius:8px; margin-top:5px; cursor:pointer;">Cancel</button>
  </div>
</div>

<script src="chat.js"></script>
</body>
</html>
