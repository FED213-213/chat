<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Private Room Chat</title>
    <link rel="icon" type="image/png" href="image/mylove.png">
  <link rel="stylesheet" href="chat.css" />
  <!-- 1. Put this link inside your <head> section -->
<script src="https://cloudflare.com"></script>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    body { margin:0; height:100vh; display:flex; flex-direction:column; background:#efe7dd; overflow:auto !important; }
    .top-bar { background:#4a148c; color:white; padding:10px 15px; display:flex; align-items:center; gap:10px; }
    #current-room-label { font-weight:bold; margin-left:10px; flex:1; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
    #change-profile-btn { background:rgba(255,255,255,0.2); border:none; color:white; width:36px; height:36px; border-radius:50%; cursor:pointer; font-size:18px; flex-shrink:0; }
    #chat-messages { flex:1 !important; height:auto !important; overflow-y:auto; padding:15px; display:flex; flex-direction:column; gap:12px; }
    .bottom-bar { background:#f0f0f0; padding:10px; display:flex; gap:8px; align-items:center; }
    .bottom-bar input#chat-input { flex:1; padding:10px 14px; border-radius:20px; border:1px solid #ccc; outline:none; }
    #send-btn { background:#4a148c; color:white; border:none; padding:10px 18px; border-radius:20px; cursor:pointer; flex-shrink:0; }
    #file-label, #mic-btn { cursor:pointer; font-size:22px; background:none; border:none; width:36px; height:36px; display:flex; align-items:center; justify-content:center; border-radius:50%; flex-shrink:0; }
    #mic-btn.recording { background:#ff3b30; color:white; animation:pulse 1s infinite; }
    @keyframes pulse { 0%{transform:scale(1)} 50%{transform:scale(1.1)} 100%{transform:scale(1)} }
    audio { max-width:220px; margin-top:5px; }
  </style>
</head>
<body>

  <div class="top-bar">
    <input type="text" id="room-input" placeholder="Room name" autocomplete="off" autocorrect="off" spellcheck="false" style="padding:6px 10px; border-radius:6px; border:none; max-width:140px;">
    <button id="join-btn" type="button" style="background:white; color:#4a148c; border:none; padding:6px 12px; border-radius:6px; cursor:pointer; font-weight:bold; flex-shrink:0;">Join / Create</button>
    <span id="current-room-label">Room: general | You: Guest</span>
    <button id="change-profile-btn" type="button">⚙️</button>
  </div>

  <div id="chat-messages"></div>

  <div id="recording-preview" class="hidden" style="display:none; background:white; padding:10px 15px; border-top:1px solid #ddd; align-items:center; gap:10px;">
    <div style="width:12px; height:12px; background:red; border-radius:50%;"></div>
    <span id="recording-time" style="font-weight:bold; color:red;">00:00</span>
    <span style="flex:1; font-size:13px; color:#666;">Recording...</span>
    <button id="recording-cancel" type="button" style="background:#eee; border:none; padding:6px 12px; border-radius:20px; cursor:pointer;">Cancel</button>
    <button id="recording-stop" type="button" style="background:#4a148c; color:white; border:none; padding:6px 12px; border-radius:20px; cursor:pointer;">Stop</button>
  </div>

  <div class="bottom-bar">
    <label id="file-label" for="file-input">📎</label>
    <input type="file" id="file-input" style="display:none;">
    <button id="mic-btn" type="button" title="Record voicenote">🎤</button>
    <input type="text" id="chat-input" placeholder="Type a message..." autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false">
    <button id="send-btn" type="button">Send</button>
  </div>

  <div id="username-overlay" class="password-overlay hidden">
    <div class="password-box">
      <h3>Set Your Profile</h3>
      <img id="avatar-preview" src="https://via.placeholder.com/100/4a148c/ffffff?text=?" style="width:80px; height:80px; border-radius:50%; object-fit:cover; margin:0 auto;">
      <input type="file" id="avatar-input" accept="image/*">
      <input type="text" id="username-input" placeholder="Your name" autocomplete="off" autocorrect="off" spellcheck="false">
      <button id="username-btn" type="button">Continue</button>
    </div>
  </div>

  <div id="room-pass-overlay" class="password-overlay hidden">
    <div class="password-box">
      <h3 id="room-pass-title">Enter Password</h3>
      <p id="room-pass-desc" style="font-size:13px; color:#666;"></p>
      <div style="display:flex; gap:5px;">
        <input type="password" id="room-pass-input" placeholder="Password" autocomplete="new-password" style="flex:1;">
        <span id="toggle-pass" style="cursor:pointer;">👁️</span>
      </div>
      <p id="room-pass-error" style="color:red; font-size:12px;"></p>
      <button id="room-pass-btn" type="button">Join Room</button>
      <button id="room-pass-close" type="button" style="background:#eee; margin-top:5px;">Cancel</button>
    </div>
  </div>

  <script src="chat.js"></script>
</body>
</html>
